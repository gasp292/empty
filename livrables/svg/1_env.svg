<svg class="dg dg-env" viewBox="0 0 1240 800" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Diagramme d&#x27;environnement" width="1240" height="800"><style>.dg{--bg:#EEF1F0;--surface:#FFFFFF;--ink:#15202A;--muted:#56636E;--line:#D3DAD9;--line-strong:#9AA6AD;--grp:#F3F6F6;--accent:#0E6A86;--c-in:#2E7D4F;--c-out:#0E6A86;--c-res:#B07A12;--c-con:#B0413E;--sec:#7C8891;--ext:#2B3A47;--ext-ink:#F2F5F6;--f-elec:#C27F0E;--f-data:#0E6A86;--f-mech:#5E6A73;--f-rf:#7456A6;--fn:#E3EEF1}
.dg{font-family:var(--font-body,'IBM Plex Sans',Arial,sans-serif);display:block}
.dg text{fill:var(--ink)}
.dg .bgr{fill:var(--surface)}
.dg .n{fill:var(--surface);stroke:var(--line-strong);stroke-width:1.2}
.dg .n.sys{fill:var(--ink);stroke:var(--ink)}
.dg .n.sys+text,.dg .t-sys{fill:var(--surface)}
.dg .n.fn{fill:var(--fn);stroke:var(--accent);stroke-width:1.4}
.dg .n.ext{fill:var(--ext);stroke:var(--ext)}
.dg .t-ext{fill:var(--ext-ink)}
.dg .n.sec{stroke:var(--sec);stroke-dasharray:5 4}
.dg .t2{fill:var(--muted);font-weight:400}
.dg .t-sys .t2,.dg .t-ext .t2{fill:inherit;opacity:.8}
.dg .t1{font-weight:600}
.dg .e{fill:none;stroke-width:1.6;stroke-linejoin:round}
.dg .e.tree{stroke:var(--line-strong);stroke-width:1.3}
.dg .e.dash{stroke-dasharray:5 4}
.dg .lbg{fill:var(--surface);opacity:.94}
.dg .lt{font-size:10.5px;fill:var(--muted)}
.dg .grp{fill:var(--grp);stroke:var(--line)}
.dg .grp-t{font-family:var(--font-mono,'IBM Plex Mono',monospace);font-size:10px;font-weight:600;letter-spacing:.08em;fill:var(--muted)}
.dg .bnd{fill:none;stroke:var(--ink);stroke-width:1.5;stroke-dasharray:9 5}
.dg .bnd-t{font-family:var(--font-mono,'IBM Plex Mono',monospace);font-size:11px;font-weight:600;letter-spacing:.06em;fill:var(--ink)}
.dg .lg{font-size:11.5px;fill:var(--ink)}
.dg .note{font-size:11px;fill:var(--muted);font-style:italic}
.dg .e.c-in{stroke:var(--c-in)}.dg .mk.c-in{fill:var(--c-in)}.dg .n.c-in{stroke:var(--c-in);stroke-width:2}.dg .e.c-out{stroke:var(--c-out)}.dg .mk.c-out{fill:var(--c-out)}.dg .n.c-out{stroke:var(--c-out);stroke-width:2}.dg .e.c-res{stroke:var(--c-res)}.dg .mk.c-res{fill:var(--c-res)}.dg .n.c-res{stroke:var(--c-res);stroke-width:2}.dg .e.c-con{stroke:var(--c-con)}.dg .mk.c-con{fill:var(--c-con)}.dg .n.c-con{stroke:var(--c-con);stroke-width:2}.dg .e.sec{stroke:var(--sec)}.dg .mk.sec{fill:var(--sec)}.dg .n.sec{stroke:var(--sec);stroke-width:2}.dg .e.f-elec{stroke:var(--f-elec)}.dg .mk.f-elec{fill:var(--f-elec)}.dg .n.f-elec{stroke:var(--f-elec);stroke-width:2}.dg .e.f-data{stroke:var(--f-data)}.dg .mk.f-data{fill:var(--f-data)}.dg .n.f-data{stroke:var(--f-data);stroke-width:2}.dg .e.f-mech{stroke:var(--f-mech)}.dg .mk.f-mech{fill:var(--f-mech)}.dg .n.f-mech{stroke:var(--f-mech);stroke-width:2}.dg .e.f-rf{stroke:var(--f-rf)}.dg .mk.f-rf{fill:var(--f-rf)}.dg .n.f-rf{stroke:var(--f-rf);stroke-width:2}</style><rect class="bgr" width="1240" height="800"/><defs><marker id="m-env-c-in" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk c-in" d="M0,0 L10,5 L0,10 z"/></marker><marker id="m-env-c-out" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk c-out" d="M0,0 L10,5 L0,10 z"/></marker><marker id="m-env-c-res" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk c-res" d="M0,0 L10,5 L0,10 z"/></marker><marker id="m-env-c-con" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk c-con" d="M0,0 L10,5 L0,10 z"/></marker><marker id="m-env-sec" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk sec" d="M0,0 L10,5 L0,10 z"/></marker><marker id="m-env-f-elec" 